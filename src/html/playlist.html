<div ng-cloak ng-controller="playlist" id="player-playlist" class="content-alignment watch-player-playlist">
	<div id="watch-appbar-playlist" class="watch-playlist player-height">
		<div class="main-content">
			<div class="playlist-header">
				<div class="playlist-header-content">
					<div class="appbar-playlist-controls clearfix"></div>
					<div class="playlist-info">
						<h3 class="playlist-title">
							<a href="#" class="yt-uix-sessionlink spf-link">Queue &#8216;n Playlist</a>
						</h3>
						<ul class="playlist-details">
							<li class="author-attribution">
								<a href="#" class="yt-uix-sessionlink spf-link">by you</a>
							</li>
							<li class="playlist-progress" ng-hide="videos.length == 0">
								<span id="playlist-current-index">1</span><span id="playlist-length">{{videos.length}} videos</span>
							</li>
						</ul>
					</div>
				</div>
			</div>
			<div class="playlist-videos-container yt-scrollbar-dark yt-scrollbar">
				<ol dnd-list="videos" id="playlist-autoscroll-list" class="playlist-videos-list yt-uix-scroller" data-scroll-action="yt.www.watch.lists.loadThumbnails" data-scroller-mousewheel-listener="" data-scroller-scroll-listener="" data-scroller-offset="0"> 
					<li ng-repeat="video in videos" class="yt-uix-scroller-scroll-unit" ng-class="{ 'currently-playing' : isCurrentVideo(video.id) }" dnd-draggable="video" dnd-moved="videos.splice($index, 1)" dnd-effect-allowed="move">
						<a class="yt-uix-button-player-controls" title="Remove item" data-tooltip-text="Remove item" ng-click="remove($index)" style="float: right;">
							<span class="yt-uix-button-icon-wrapper">
								<span class="yt-uix-button-icon qnp-btn-playlist-close yt-sprite"></span>
							</span>
						</a>
						<span class="index"> {{ isCurrentVideo(video.id) ? '▶' : ($index + 1) }} </span>
						<a href="/watch?v={{ video.id }}" class="yt-uix-sessionlink spf-link playlist-video clearfix spf-link" style="width:95%">
							<span class="video-thumb yt-thumb yt-thumb-72">
								<span class="yt-thumb-default">
									<span class="yt-thumb-clip">
										<img width="72" aria-hidden="true" src="https://i.ytimg.com/vi/{{ video.id }}/hqdefault.jpg" alt=""/>
										<span class="vertical-align"></span>
									</span>
								</span>
							</span>
							<div class="playlist-video-description">
								<h4 class="yt-ui-ellipsis yt-ui-ellipsis-2"> {{ video.title }} </h4>
								<span class="video-uploader-byline">
									<span class="" data-ytid="UCf3cbfAXgPFL6OywH7JwOzA">{{ video.author }}</span>
								</span>
							</div>
						</a>
					</li>
				</ol>
			</div>
		</div>
	</div>
</div>
