<div ng-cloak ng-controller="mini-playlist" id="qnp-playlist-container" class="watch-playlist" ng-hide="isHidden" ng-class="{ 'collapsed': isCollapsed }">
	<div class="main-content">
		<div class="playlist-header">
			<div class="playlist-header-content" data-list-title="Queue 'n Playlist">
				<div class="app-bar-playlist-controls">
					<a class="yt-uix-button-player-controls" title="Close playlist" data-tooltip-text="Close playlist" ng-click="hide()">
						<span class="yt-uix-button-icon-wrapper">
							<span class="yt-uix-button-icon qnp-btn-playlist-close yt-sprite"></span>
						</span>
					</a>
				</div>
				<div class="app-bar-playlist-controls-collapse">
					<a class="yt-uix-button-player-controls" title="Collapse" data-tooltip-text="Collapse" data-collapse="false" ng-click="collapse()">
						<span class="yt-uix-button-icon-wrapper">
							<span id="qnp-collapser" class="yt-uix-button-icon qnp-btn-playlist-collapse-out yt-sprite"></span>
						</span>
					</a>
				</div>
				<div class="playlist-info">
					<h3 class="playlist-title">
						<a class="yt-uix-sessionlink">Queue 'n Playlist</a>
						<ul class="playlist-details">
							<li class="author-attribution">by you</li>
						</ul>
					</h3> 
				</div>
			</div>
			<div class="control-bar clearfix"></div>
		</div>
		<div class="playlist-videos-container yt-scrollbar-dark yt-scrollbar">
			<ol dnd-list="videos" ng-class="{ 'collapsed': isCollapsed }" id="qnp-playlist" class="playlist-videos-list yt-uix-scroller " data-scroller-offset="0" data-scroller-mousewheellistener="" data-scroller-scroll-listener="" data-scroller-mousewheel-listener="">
				<li ng-repeat="video in videos" dnd-draggable="video" dnd-moved="videos.splice($index, 1)" dnd-effect-allowed="move" class="yt-uix-scroller-scroll-unit" ng-class="{ 'currently-playing' : isCurrentVideo(video.id) }">
					<a class="yt-uix-button-player-controls" title="Remove item" data-tooltip-text="Remove item" ng-click="remove($index)" style="float: right;">
						<span class="yt-uix-button-icon-wrapper">
							<span class="yt-uix-button-icon qnp-btn-playlist-close yt-sprite"></span>
						</span>
					</a>
					<span class="index"> {{ isCurrentVideo(video.id) ? '▶' : ($index + 1) }} </span>
					<a href="/watch?v={{ video.id }}" class="yt-uix-sessionlink spf-link playlist-video clearfix spf-link">
						<span class="video-thumb yt-thumb yt-thumb-72">
							<span class="yt-thumb-default">
								<span class="yt-thumb-clip">
									<img width="72" aria-hidden="true" src="https://i.ytimg.com/vi/{{ video.id }}/hqdefault.jpg" alt="">
									<span class="vertical-align"></span>
								</span>
							</span>
						</span>
						<div class="playlist-video-description">
							<h4 class="yt-ui-ellipsis yt-ui-ellipsis-2"> {{ video.title }} </h4>
							<span class="video-uploader-byline">
								<span class="" data-ytid="UCf3cbfAXgPFL6OywH7JwOzA">{{ video.author }}</span>
							</span>
						</div>
					</a>
				</li>
				<li ng-show="videos.length == 0">
					<span style="padding: 0px 10px;">All dem empty spaces..</span>
				</li>
			</ol>
		</div>
	</div>
</div>
